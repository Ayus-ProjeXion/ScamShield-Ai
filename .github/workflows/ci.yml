name: ScamShield AI — Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, frontend, backend, ai-engine ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-security:
    name: Backend API & Adversarial Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flac ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Security & Penetration Audit (11/11 Checks)
        run: |
          python test_security_deep_audit.py

      - name: Execute FastAPI Backend Test Suite (12/12 Endpoints)
        run: |
          python -m backend.test_api

  frontend-build:
    name: Frontend Mission Control Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Build Vite Production Bundle
        run: |
          npm run build --prefix frontend
